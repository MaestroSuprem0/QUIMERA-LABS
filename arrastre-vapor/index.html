<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QUIMERA LABS Arrastre de Vapor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: banco de laboratorio a pantalla completa (escena 3D) + cuaderno de práctica a la derecha; en móvil se apilan. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#15212C; --muted:#566874; --line:#D5DEE3;
  --accent:#C2276F; --accent-soft:#F7DCE8; --ok:#23794E; --warn:#9A5B00;
  --ink3d:#15212C; --grid:#D3DCE1; --glass:#BFE2EC; --bench:#F1F4F6; --glassink:#15212C; --water:#8EC9DE; --oil:#E0A93B; --leaf:#5E9E45; color-scheme:light;
  --f-display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.credit{font-size:12.5px;color:var(--muted);margin-top:3px}
.credit b{color:var(--ink);font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow a.home{color:var(--accent);font-weight:500;text-decoration:none}
.eyebrow a.home:hover{text-decoration:underline}
.eyebrow a.home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow b{color:var(--accent);font-weight:500}
h1{margin:0;font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:clamp(22px,3vw,30px);letter-spacing:.01em;line-height:1.05;text-wrap:balance}
.modes{display:flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.modes button{font:600 13px/1 var(--f-display);font-stretch:85%;letter-spacing:.08em;text-transform:uppercase;border:0;background:transparent;color:var(--ink);
  padding:9px 14px;border-radius:999px;cursor:pointer;display:flex;gap:7px;align-items:center}
.modes button .n{font-family:var(--f-mono);font-weight:400;opacity:.6}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.modes button:focus-visible,.tool:focus-visible,.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.stage{position:relative;overflow:hidden;min-height:0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.leader{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 4}
.tie{fill:none;stroke:var(--ink);stroke-width:1.5}
.dot{position:absolute;left:0;top:0;pointer-events:auto;width:18px;height:18px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--surface);
  box-shadow:0 0 0 2px var(--ink),inset 0 0 0 4px var(--surface),inset 0 0 0 9px var(--accent)}
.dot.sel{box-shadow:0 0 0 2px var(--accent),inset 0 0 0 4px var(--surface),inset 0 0 0 9px var(--accent)}
.tag{position:absolute;left:0;top:0;pointer-events:auto;font:700 11.5px/1 var(--f-display);font-stretch:85%;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:6px 8px;cursor:pointer}
.tag.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.locked .toolbar{display:none}
.meters{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.meter{height:12px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;display:flex;background:var(--surface)}
.meter i{display:block;height:100%;transition:width .3s}
.meter i.w{background:var(--water)} .meter i.o{background:var(--oil)} .meter i.g{background:var(--leaf)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rin-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rin-row .seg{flex:1;min-width:180px}
.res{width:100%;border-collapse:collapse;font-size:13.5px}
.res td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.res td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tag-ok{color:var(--ok);font-weight:600}.tag-warn{color:var(--warn);font-weight:600}
.calc{font-family:var(--f-mono);font-size:12.5px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;line-height:1.75;margin-top:8px}
.calc .note{font-family:var(--f-body)}
details.ph summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
.btn:disabled:hover{background:transparent;color:var(--ink)}
.labels-off .tag,.labels-off .tie{display:none}
.hdr-right{display:flex;gap:10px;align-items:center}
.theme{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.popup{position:absolute;top:16px;left:16px;width:min(300px,calc(100% - 32px));background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;
  padding:14px 16px;box-shadow:6px 6px 0 var(--line);display:flex;flex-direction:column;gap:8px}
.popup h3{margin:0;font:800 17px/1.15 var(--f-display);font-stretch:80%;letter-spacing:.04em;text-transform:uppercase;padding-right:28px}
.popup p{margin:0;color:var(--muted);font-size:14px}
.popup .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:18px;border-radius:6px}
.btn{align-self:flex-start;font:700 12px/1 var(--f-display);font-stretch:85%;letter-spacing:.09em;text-transform:uppercase;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);border-radius:7px;padding:9px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--ink);color:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;
  background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:4px}
.tool{width:38px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.tool:hover{background:var(--accent-soft)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;background:var(--line);margin:6px 3px}
.toast{position:absolute;left:16px;right:16px;bottom:calc(66px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:min(520px,calc(100% - 32px));
  background:var(--ink);color:var(--surface);border-radius:8px;padding:9px 14px;font-size:14px;text-align:center;transition:opacity .25s}
.toast.warn{background:var(--warn);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.hint{position:absolute;right:16px;top:14px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;line-height:1.6}

aside{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;min-height:0;min-width:0;
  padding-block:20px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
aside h2{margin:0;font:800 24px/1.1 var(--f-display);font-stretch:78%;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
aside h4{margin:0 0 4px;font:700 11.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
aside p{margin:0}
.lead{color:var(--muted)}
.spec{font-family:var(--f-mono);font-size:12.5px;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;color:var(--ink)}
.block{display:flex;flex-direction:column;gap:4px}
.block.err{border-left:3px solid var(--warn);padding-left:12px}
.block.err h4{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px/1 var(--f-body);border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 11px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.steps .st{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:500 11px/1 var(--f-mono);color:var(--muted)}
.steps li.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.next .st{border-color:var(--accent);color:var(--accent)}
.steps li.next b{color:var(--accent)}
.steps li.locked{opacity:.55}
.steps small{display:block;color:var(--muted);font-size:13px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
.ctl{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:600 13px/1 var(--f-body);padding:10px 6px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.reading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border:1.5px solid var(--ink);border-radius:9px;padding:12px 14px}
.reading .v{font:500 30px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.reading .u{font:500 13px var(--f-mono);color:var(--muted)}
.swatch{display:flex;gap:10px;align-items:center}
.swatch i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.state{border-radius:8px;padding:10px 12px;background:var(--accent-soft);font-size:14px}
.state.warn{background:transparent;border:1.5px solid var(--warn)}
.state.ok{background:transparent;border:1.5px solid var(--ok)}
.note{font-size:13px;color:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}

@media (max-width:860px){
  .app{height:auto}
  main{grid-template-columns:1fr}
  .stage{height:62vh;min-height:430px}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  .modes button{padding:9px 11px}
}
@media (prefers-reduced-motion: reduce){ .progress i,.toast{transition:none} }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   1) MANIFIESTO DEL EQUIPO — destilación por arrastre de vapor.
   Comparado con la titulación, cambia esta sección, la 4 (piezas) y el
   modo Operar. El núcleo (3, 5, 6) y Explorar/Ensamblar son los mismos.
   ===================================================================== */
const EQUIPO = {
  id: 'arrastre-vapor',
  partes: {
    soportes: { nombre:'Soportes universales y pinzas', tag:'Soportes y pinzas', corto:'Dos soportes con nuez y pinza: uno sujeta el balón de la muestra, otro el refrigerante.',
      funcion:'Fijan las piezas de vidrio para que el montaje no dependa de los tapones: una unión de vidrio con tapón no aguanta peso ni torsión.',
      uso:'Sujeta el balón por el cuello y el refrigerante por su centro, sin apretar de más. Las varillas van detrás del montaje.',
      error:'Dejar el refrigerante colgando solo de los tapones: la unión cede y el vidrio se rompe.',
      dato:'Pinzas de tres dedos con funda de goma · nuez doble', requiere:[] },
    tripode: { nombre:'Trípode y tela metálica', corto:'Soporte de tres patas con una malla que reparte el calor de la llama.',
      funcion:'Sostiene el generador sobre el mechero. La tela con centro cerámico reparte la llama para que el vidrio no se caliente en un solo punto.',
      uso:'Centra la tela sobre el trípode; el fondo del balón debe apoyarse en el disco cerámico.',
      error:'Calentar el balón directo a la llama, sin tela: el calentamiento puntual puede quebrar el vidrio.',
      dato:'Hierro · tela de acero con centro cerámico', requiere:[] },
    mechero: { nombre:'Mechero Bunsen', corto:'Quemador de gas: la fuente de calor del generador.',
      funcion:'Calienta el agua del generador hasta que hierve. El anillo inferior regula el aire: con aire la llama es azul y caliente; sin aire, amarilla y con hollín.',
      uso:'Abre primero el agua del refrigerante. Acerca la llama del encendedor a la boca y luego abre el gas. Ajusta hasta ver un cono azul.',
      error:'Abrir el gas antes de tener la llama lista: el gas se acumula y la ignición es brusca.',
      dato:'La zona más caliente está justo encima del cono azul interior', requiere:['tripode'] },
    gas: { nombre:'Llave de gas', corto:'Válvula de la línea de gas del laboratorio.', sub:'mechero',
      funcion:'Corta o abre el suministro al mechero. Es lo primero que se cierra ante una emergencia.',
      uso:'Manija paralela a la tubería: abierta. Perpendicular: cerrada. Al terminar ciérrala aquí, no solo en el mechero.',
      error:'Apagar el mechero y dejar la llave de la línea abierta.',
      dato:'Manguera de látex o silicona apta para gas' },
    generador: { nombre:'Generador de vapor', corto:'Balón con agua que, al hervir, produce el vapor de arrastre.',
      funcion:'Produce vapor de forma continua. Ese vapor atraviesa la planta y arrastra los aceites esenciales, que son volátiles y no se mezclan con el agua.',
      uso:'Llénalo hasta la mitad, como mucho dos tercios, y añade piedras de ebullición para que hierva sin sacudidas.',
      error:'Llenarlo de más: el agua hirviendo sube por el tubo de vapor y llega líquida a la muestra.',
      dato:'Balón de fondo redondo 500–1000 mL · borosilicato', requiere:['tripode'] },
    seguridad: { nombre:'Tubo de seguridad', corto:'Tubo largo y abierto que se sumerge en el agua del generador.', sub:'generador',
      funcion:'Regula la presión. Si el paso del vapor se obstruye, el agua sube por este tubo y avisa. Al enfriar, deja entrar aire y evita que el líquido de la muestra retroceda al generador.',
      uso:'Su extremo inferior debe quedar dentro del agua, cerca del fondo. Vigila la columna de agua: si sube mucho, baja la llama o busca una obstrucción.',
      error:'Taparlo o dejarlo fuera del agua: se pierde la protección contra sobrepresión y retroceso.',
      dato:'Tubo de vidrio abierto de 50–60 cm' },
    vapor: { nombre:'Tubo de conducción de vapor', tag:'Tubo de vapor', corto:'Tubo de vidrio doblado que lleva el vapor del generador a la muestra.',
      funcion:'Conduce el vapor y lo libera en el fondo del balón de la muestra, para que atraviese todo el material vegetal.',
      uso:'En el generador termina por encima del agua; en la muestra, cerca del fondo. Los tapones deben ajustar sin fugas.',
      error:'Sumergirlo en el agua del generador: lo que sale es agua caliente, no vapor.',
      dato:'Vidrio de 6–8 mm · tapones de goma horadados', requiere:['generador','muestra'] },
    muestra: { nombre:'Balón de destilación', tag:'Balón con la muestra', corto:'Balón de fondo redondo donde se coloca el material vegetal.',
      funcion:'Contiene la planta. El vapor la atraviesa, rompe las células que guardan el aceite y se lo lleva.',
      uso:'Llénalo hasta la mitad con material troceado y sin compactar, para que el vapor pase por todo.',
      error:'Compactar la planta: el vapor abre canales y deja zonas sin extraer.',
      dato:'Balón de fondo redondo 500–1000 mL', requiere:['soportes'] },
    rejilla: { nombre:'Rejilla de soporte', corto:'Malla que mantiene la planta separada del agua condensada.', sub:'muestra',
      funcion:'Evita que el material vegetal se empape con el agua que se condensa en el fondo; así el vapor sigue fluyendo entre las hojas.',
      uso:'Colócala antes de cargar la planta. El tubo de vapor debe salir por debajo de ella.',
      error:'Omitirla con mucha muestra: la planta se cuece en el agua del fondo y baja el rendimiento.',
      dato:'Malla de acero inoxidable' },
    condensador: { nombre:'Refrigerante Liebig', corto:'Tubo con camisa de agua fría que convierte el vapor en líquido.',
      funcion:'El vapor viaja por el tubo interior; el agua fría que corre por la camisa exterior lo enfría y lo condensa.',
      uso:'El agua entra por la boquilla de abajo y sale por la de arriba, a contracorriente: así la camisa queda llena y enfría al máximo.',

const glassMats = [];
function glassMat(){
  const m = new THREE.ShaderMaterial({ uniforms:{ tint:{value:new THREE.Color()}, ink:{value:new THREE.Color()}, acc:{value:new THREE.Color()}, hi:{value:0} },
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:`varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 tint; uniform vec3 ink; uniform vec3 acc; uniform float hi; varying vec3 vN;
      void main(){ vec3 n = normalize(vN); float f = 1.0 - abs(n.z); float rim = smoothstep(0.66, 0.97, f);
        float band = gl_FrontFacing ? smoothstep(0.22,0.28,n.x) * (1.0 - smoothstep(0.40,0.46,n.x)) : 0.0;
        vec3 col = mix(tint, ink, rim*0.9) + band*0.55; col = mix(col, acc, hi*0.45);
        gl_FragColor = vec4(col, 0.10 + rim*0.82 + band*0.35 + hi*0.12); }` });

}

const pickables = [];
function mk(geo, mat, parent, { pos=[0,0,0], rot=[0,0,0], outline=true, shadow=true, part=null, sub=null, ctrl=null, order=0, noGhost=false }={}){
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = shadow; m.receiveShadow = true; m.renderOrder = order; if (noGhost) m.userData.noGhost = true;
  if (outline){ const o = new THREE.Mesh(geo, outlineMat); o.userData.outline = true; o.castShadow = false; o.raycast = ()=>{}; m.add(o); }
  if (part){ m.userData.part = part; if (sub) m.userData.sub = sub; if (ctrl) m.userData.ctrl = ctrl; pickables.push(m); }
  parent.add(m); return m;
}
const colliderMat = new THREE.MeshBasicMaterial({ visible:false });
function collider(geo, parent, pos, part, { sub=null, ctrl=null, quat=null }={}){ const m = new THREE.Mesh(geo, colliderMat); m.position.set(...pos); if (quat) m.quaternion.copy(quat);
  m.userData.part = part; if (sub) m.userData.sub = sub; if (ctrl) m.userData.ctrl = ctrl; pickables.push(m); parent.add(m); return m; }
function anchor(key, name, pos){ const a = new THREE.Object3D(); a.position.set(...pos); a.userData = { name }; parts[key].group.add(a); parts[key].anchors.push(a); return a; }
const box = (w,h,d,r=0.35) => new RoundedBoxGeometry(w,h,d,3,r);
// Cilindro entre dos puntos (varillas, patas, tubos rectos)
function segment(a, b, r, mat, parent, opts={}){ const A = new V3(...a), B = new V3(...b), d = B.clone().sub(A);
  const m = mk(new THREE.CylinderGeometry(r, r, d.length(), opts.seg || 14), mat, parent, { ...opts, pos:A.clone().add(B).multiplyScalar(0.5).toArray() });
  m.quaternion.setFromUnitVectors(Y, d.normalize()); return m; }
// Tubo curvo por puntos (vidrio doblado, mangueras). Guarda la curva para mover partículas por dentro.
function tube(pts, r, mat, parent, opts={}){ const curve = new THREE.CatmullRomCurve3(pts.map(p => new V3(...p)), false, 'centripetal');
  const m = mk(new THREE.TubeGeometry(curve, opts.tseg || 90, r, 10, false), mat, parent, opts); m.userData.curve = curve; return m; }
// Superficie de revolución a partir de una función radio(y)
function lathe(fnR, y0, y1, n=18){ const pts = [new V2(0,y0)]; for (let i=0;i<=n;i++){ const y = y0+(y1-y0)*i/n; pts.push(new V2(Math.max(0.03, fnR(y)), y)); } pts.push(new V2(0,y1)); return new THREE.LatheGeometry(pts, 36); }
// Líquido entre dos alturas dentro de un recipiente (se reconstruye solo si cambia)
function liquid(parent, pos, fnR, mat, order=1){
  const L = { a:-1, b:-1 }; L.mesh = mk(new THREE.BufferGeometry(), mat, parent, { pos, outline:false, shadow:false, order, noGhost:true }); L.mesh.visible = false;
  L.set = (na, nb) => { if (Math.abs(na-L.a) < 0.015 && Math.abs(nb-L.b) < 0.015) return; L.a = na; L.b = nb;
    L.mesh.visible = nb - na > 0.03; if (L.mesh.visible){ L.mesh.geometry.dispose(); L.mesh.geometry = lathe(fnR, na, nb); } };
  return L; }
const sphR = (R, inset) => y => Math.sqrt(Math.max(0, R*R - (y-R)*(y-R))) - inset;
function roundFlask(R, neckR, neckTop){ const pts = [], yJ = R + Math.sqrt(R*R - neckR*neckR), aTop = Math.asin((yJ-R)/R);
  for (let i=0;i<=24;i++){ const a = -Math.PI/2 + (aTop + Math.PI/2)*i/24; pts.push(new V2(Math.max(0.001, R*Math.cos(a)), R + R*Math.sin(a))); }
  pts.push(new V2(neckR, neckTop), new V2(neckR+0.25, neckTop+0.1), new V2(neckR+0.25, neckTop+0.5), new V2(neckR, neckTop+0.55)); return new THREE.LatheGeometry(pts, 44); }

function clampTo(g, part, rod, target, jawR, axis){

  mk(box(0.9,0.9,Math.abs(tz-rz)-jawR,0.2), M.clamp, g, { pos:[tx,ty,(rz+tz-jawR)/2], part });
  const jaw = mk(new THREE.TorusGeometry(jawR+0.35, 0.3, 8, 26, Math.PI*1.5), M.jaw, g, { pos:[tx,ty,tz], part });
  jaw.quaternion.setFromUnitVectors(Z, axis.clone().normalize()); jaw.rotateZ(-Math.PI*0.25);
}

const PLANTAS = {

  clavo:     { nombre:'Clavo de olor', comp:'eugenol', Tb:254, M:164.2, rho:1.06, rend:10, oil:0xC98A3A, leaf:[0x6B3E22,0x7A4A2A,0x5C3418] },

const op = { planta:'eucalipto', lugar:'lima', vel:1 };

function setPump(v){ op.pump = v; renderOperatePanel(); }

// --- Volumen → altura del líquido (en cm, 1 unidad = 1 cm)
const recH = V => V/(Math.PI*3.4*3.4);
const FUN_TABLE = (() => { const t = []; let v = 0; for (let y = 6.6; y <= 15.6; y += 0.02){ t.push([y, v]); const r = rP(y) - 0.14; v += Math.PI*r*r*0.02; } return t; })();

const genLevel = () => capH(op.gen, 5.8);                                          // casquete esférico del balón (1 unidad = 1 cm)
function layers(L1, L2, base, h1, h2, oilBottom){ // dos capas apiladas: inferior y superior

// --- Partículas (vapor, burbujas, gotas, agua en mangueras)
const particles = [];
function pool(n, geo, mat, order=5){ const arr = []; for (let i=0;i<n;i++){ const m = new THREE.Mesh(geo, mat); m.visible = false; m.renderOrder = order; scene.add(m); const p = { m, on:false }; arr.push(p); particles.push(p); } return arr; }

const puffMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.75, depthWrite:false });
const P = {
  steam: pool(26, new THREE.SphereGeometry(0.26,8,6), puffMat, 4),
  cond: pool(30, new THREE.SphereGeometry(0.36,8,6), puffMat, 4),
  escape: pool(18, new THREE.SphereGeometry(0.7,10,8), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.55, depthWrite:false }), 6),
  bubG: pool(18, new THREE.SphereGeometry(0.22,8,6), puffMat, 2),
  bubS: pool(14, new THREE.SphereGeometry(0.24,8,6), puffMat, 2),

function updateOperate(dt){

  // --- calor y vapor

  const boiling = op.T >= 1 && heating, rate = boiling ? (op.llama === 2 ? 1.6 : 0.8) : 0;   // mL de vapor por segundo

  setTxt('vGen', `${fmt(op.gen,0)} mL · ${fmt(Tg)} °C`); setTxt('vTh', fmt(op.Th)); setMeter('mPlant', op.pf);

function setMeter(id, v){ const el = document.getElementById(id); if (el) el.style.width = (Math.max(0, Math.min(1, v))*100).toFixed(1) + '%'; }

      if (op.llaveE && op.fo <= 0.001) return ['warn','¡Cierra la llave! Ya salió el aceite y ahora viene el agua.'];
      if (op.llaveE) return ['',`El aceite de ${pl.nombre.toLowerCase()} es más denso que el agua: está abajo y sale primero. Este es tu producto: cierra cuando la interfase llegue a la llave.`];
      if (op.fo <= 0.01 && op.co > 0) return ['ok','Separación lista: el aceite esencial quedó en el vaso y el agua en el embudo.'];
      return ['',`Fíjate: el ${pl.comp} (densidad ${fmt(pl.rho,2)} g/mL) se fue al fondo. Quita el tapón y abre la llave.`];
    }
    const perd = op.co/Math.max(1e-6, op.co + op.fo);
    if (perd > 0.15) return ['warn',`Se fue el ${fmt(perd*100,0)} % del aceite por la llave. Debías cerrar cuando la interfase llegó a la llave.`];
    if (op.llaveE && bottom <= 0.001) return ['warn','¡Cierra la llave! Ya salió el agua y ahora se va el aceite.'];
    if (!op.llaveE && op.co > 0.01 && op.fw <= 0.5) return ['ok',`Separación lista. Perdiste ${fmt(op.co,2)} mL en la interfase: una pequeña pérdida es normal.`];
    if (op.llaveE) return ['','Sale la fase acuosa de abajo. Cierra justo cuando la línea entre agua y aceite llegue a la llave.'];
    if (op.fw <= 0.5 && op.fo > 0) return ['ok','Separación lista: el aceite esencial quedó en el embudo.'];
    return ['',`El ${pl.comp} (densidad ${fmt(pl.rho,2)} g/mL) flota sobre el agua. Quita el tapón y abre la llave.`];
  }
  if (op.spill) return ['warn','¡El agua rebosa por el tubo de seguridad! Apaga el mechero: el vapor no tiene salida.'];
  if (op.obst) return ['warn','El agua sube por el tubo de seguridad y ya no burbujea la muestra: el tubo de vapor está obstruido. Apaga el mechero y deja enfriar.'];
  if (op.llama > 0 && op.gen <= 8) return ['warn','Generador seco: apaga la llama ya. Calentar un balón vacío puede romperlo.'];
  if (op.overflow && op.llama > 0) return ['warn','El receptor está lleno y el destilado se derrama. Apaga el mechero.'];
  if (passing && op.jf <= 0.8) return ['warn','El vapor sale sin condensar por la alargadera y el aceite se pierde con él. Enciende el agua del refrigerante.'];
  if (op.llama > 0 && !op.pump) return ['warn','Primero el agua del refrigerante y después el calor.'];
  if (boiling && op.llama === 2) return ['warn','Llama fuerte: el agua sube por el tubo de seguridad y la ebullición violenta puede arrastrar agua líquida a la muestra. Baja a suave.'];
  if (op.llama > 0 && op.gen < 80) return ['warn','Queda poca agua en el generador. Apaga antes de que se seque.'];
  if (passing && op.Th > op.Tw - 0.6) return ['ok',`El termómetro llegó a ${fmt(op.Tw)} °C, la ebullición del agua pura: ya casi no sale aceite. Es momento de apagar.`];
  if (passing && op.pf < 0.15) return ['',`La temperatura empieza a subir hacia ${fmt(op.Tw)} °C: queda poco aceite en la planta.`];
  if (passing && op.Th > op.dal.T - 0.6) return ['ok',`Destila a ${fmt(op.dal.T)} °C, por debajo de los ${fmt(op.Tw)} °C del agua y muy lejos de los ${fmt(pl.Tb,0)} °C del ${pl.comp}. Así funciona el arrastre de vapor.`];
  if (passing) return ['','El vapor con aceite llega al termómetro y se condensa en el refrigerante.'];
  if (boiling) return ['','Hierve el generador. El vapor atraviesa la planta y calienta el balón de la muestra: al principio se condensa ahí mismo.'];
  if (op.llama > 0) return ['','Calentando el agua del generador…'];
  if (op.everOn && op.T > 0.05) return ['','Enfriando. Al bajar la presión, el tubo de seguridad deja entrar aire y evita que el líquido de la muestra retroceda.'];
  if (canTransfer()) return ['ok','Apagado. Ya puedes pasar el destilado al embudo de decantación.'];
  return ['','Elige la planta y el lugar. Luego enciende la bomba del refrigerante y el mechero.'];
}

function balanceHTML(){
  const pl = PLANTAS[op.planta], db = dense(), recup = db ? op.co : op.fo, perdDec = db ? op.fo : op.co;
  const rend = recup*pl.rho/MASA*100;
  return `<div class="block"><h4>Balance de aceite</h4><table class="res"><tbody>
    <tr><td>En los ${MASA} g de planta (rendimiento típico ~${fmt(pl.rend,1)} %)</td><td class="n">${fmt(op.oilTot,2)} mL</td></tr>
    <tr><td>Quedó en la planta</td><td class="n">${fmt(op.oilTot*op.pf,2)} mL</td></tr>
    <tr><td>Perdido sin refrigerar o por rebalse</td><td class="n ${op.lostOil > 0.01 ? 'tag-warn' : ''}">${fmt(op.lostOil,2)} mL</td></tr>
    <tr><td>Perdido en la separación</td><td class="n ${perdDec > 0.01 ? 'tag-warn' : ''}">${fmt(op.stage === 'decantar' ? perdDec : 0,2)} mL</td></tr>
    <tr><td><b>Aceite recuperado</b></td><td class="n"><b>${fmt(op.stage === 'decantar' ? recup : 0,2)} mL</b></td></tr>
    <tr><td>Rendimiento obtenido (masa de aceite / masa de planta)</td><td class="n">${fmt(op.stage === 'decantar' ? rend : 0,2)} %</td></tr>
  </tbody></table></div>`;
}
function renderOperatePanel(){
  const [kind, msg] = opStatus(), dec = op.stage === 'decantar', pl = PLANTAS[op.planta], d = op.dal, P = LUGARES[op.lugar].P;
  const seg = (name, opts, cur, attr, disabled=false) => `<div class="seg" role="group" aria-label="${name}">${opts.map((t,i) => `<button ${attr}="${i}" aria-pressed="${cur===i}" ${disabled?'disabled':''}>${t}</button>`).join('')}</div>`;
  const pKeys = Object.keys(PLANTAS), lKeys = Object.keys(LUGARES);
  panel.innerHTML = `<div class="block"><h4>Modo operar</h4><h2>Destila y separa</h2></div>
    <div class="ctl"><h4>Muestra (100 g)</h4>${seg('Planta', pKeys.map(k => PLANTAS[k].nombre), pKeys.indexOf(op.planta), 'data-pl', op.everOn)}
      ${seg('Lugar', lKeys.map(k => LUGARES[k].nombre), lKeys.indexOf(op.lugar), 'data-lu', op.everOn)}
      ${op.everOn ? '<span class="note">Para cambiar la muestra o el lugar, reinicia.</span>' : ''}</div>
    <div class="ctl"><h4>Agua del refrigerante (bomba)</h4>${seg('Bomba',['Apagada','Encendida'], op.pump?1:0, 'data-pu', dec)}</div>
    <div class="ctl"><h4>Mechero</h4>${seg('Mechero',['Apagado','Suave','Fuerte'], op.llama, 'data-ll', dec)}</div>
    <div class="reading"><div><h4>Termómetro</h4><span class="note">Vapor que entra al refrigerante</span></div><div><span class="v" id="vTh">${fmt(op.Th)}</span> <span class="u">°C</span></div></div>
    <div class="meters">
      <div class="mrow"><span>Generador · <b id="genState">Frío</b> · <span id="vGen"></span></span></div>
      <div class="mrow"><span>Aceite que queda en la planta</span><div class="meter"><i class="g" id="mPlant"></i></div></div>
      <div class="mrow"><span>Receptor · <span id="vRec"></span></span></div>
      ${dec ? `<div class="mrow"><span>Embudo · <span id="vFun"></span></span></div><div class="mrow"><span>Vaso colector · <span id="vCol"></span></span></div>` : ''}
    </div>
    <div class="state ${kind}">${msg}</div>
    <div class="rin-row"><button class="btn" id="lookOil">Ver la capa de aceite</button>
      ${seg('Velocidad de la simulación',['Tiempo real','× 5'], op.vel === 1 ? 0 : 1, 'data-ve')}</div>
    <div class="ctl"><h4>Separación</h4>
      ${dec ? `${seg('Tapón',['Tapón puesto','Tapón quitado'], op.tapon?0:1, 'data-tp')}${seg('Llave del embudo',['Llave cerrada','Llave abierta'], op.llaveE?1:0, 'data-le')}`
            : `<button class="btn" id="toFun" ${canTransfer()?'':'disabled'}>Pasar al embudo</button><span class="note">Se habilita con el mechero apagado, el sistema frío y destilado en el receptor.</span>`}</div>
    ${balanceHTML()}
    <details class="ph"><summary>¿Por qué destila por debajo de ${fmt(op.Tw)} °C?</summary><div class="calc">
      En ${LUGARES[op.lugar].nombre}: P<sub>atm</sub> ≈ ${P} mmHg<br>
      Agua sola: hierve a ${fmt(op.Tw)} °C<br>
      Mezcla: hierve cuando P<sub>agua</sub> + P<sub>${pl.comp}</sub> = P<sub>atm</sub><br>
      A ${fmt(d.T)} °C: ${fmt(d.pw,0)} + ${fmt(d.po,0)} = ${P} mmHg<br>
      El vapor lleva ~${fmt(d.x*100,1)} % de moléculas de ${pl.comp}.<br>
      <span class="note">P<sub>agua</sub> con la ecuación de Antoine; P<sub>aceite</sub> estimada con Clausius-Clapeyron y la regla de Trouton (aproximación).</span></div></details>
    <button class="btn" id="opReset">Reiniciar</button>
    <p class="note">Química real en temperaturas y volúmenes; tiempos y caudal de vapor simplificados. Las capas de aceite muy delgadas se dibujan con un grosor mínimo para que se vean.</p>`;
  panel.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { op.planta = pKeys[+b.dataset.pl]; resetOperate(); });
  panel.querySelectorAll('[data-lu]').forEach(b => b.onclick = () => { op.lugar = lKeys[+b.dataset.lu]; resetOperate(); });
  panel.querySelectorAll('[data-ve]').forEach(b => b.onclick = () => { op.vel = b.dataset.ve === '1' ? 5 : 1; renderOperatePanel(); });
  panel.querySelectorAll('[data-pu]').forEach(b => b.onclick = () => setPump(b.dataset.pu === '1'));
  panel.querySelectorAll('[data-ll]').forEach(b => b.onclick = () => setFlame(+b.dataset.ll));
  panel.querySelectorAll('[data-tp]').forEach(b => b.onclick = () => setStopper(b.dataset.tp === '0'));
  panel.querySelectorAll('[data-le]').forEach(b => b.onclick = () => setValve(b.dataset.le === '1'));
  $('#lookOil').onclick = lookAtOil;
  const tf = $('#toFun'); if (tf) tf.onclick = () => canTransfer() && transfer();
  $('#opReset').onclick = () => resetOperate();
  op.lastKey = [kind,msg].join('|') + op.stage + canTransfer() + op.pump + op.llama + op.llaveE + op.tapon + op.vel + op.everOn;
}

/* ====================== 9) Cambio de modo, eventos y bucle ====================== */
function setMode(name){ if (mode === MODES[name]) return; mode?.exit(); mode = MODES[name];
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === name)); mode.enter(); }
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
let downAt = null;
renderer.domElement.addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY];
  if (mode === MODES.ensamblar && ev.button === 0 && startDrag(ev)){ renderer.domElement.setPointerCapture(ev.pointerId); ev.stopImmediatePropagation(); } }, { capture:true });
renderer.domElement.addEventListener('pointermove', ev => {
  if (drag){ moveDrag(ev); return; }
  if (mode === MODES.ensamblar){ if (!ev.buttons) renderer.domElement.style.cursor = pick(ev, looseList()) ? 'grab' : ''; return; }
  if (ev.buttons) return;
  const hit = pick(ev);
  if (mode === MODES.operar){ renderer.domElement.style.cursor = hit?.object.userData.ctrl ? 'pointer' : ''; return; }
  const key = hit ? keyOf(hit.object) : null;
  if (key !== hovered){ if (hovered && hovered !== selected) setHighlight(hovered,false); hovered = key; if (hovered && hovered !== selected) setHighlight(hovered,true,0.12); }
  renderer.domElement.style.cursor = key ? 'pointer' : ''; });
renderer.domElement.addEventListener('pointerup', ev => { if (drag){ endDrag(); return; }
  if (!downAt || Math.hypot(ev.clientX-downAt[0], ev.clientY-downAt[1]) > 5) return; mode.click?.(pick(ev)); });
const curTheta = () => new THREE.Spherical().setFromVector3(new V3().subVectors(camera.position, controls.target)).theta;
$('#tRotL').onclick = () => flyTo({ theta: curTheta() - Math.PI/4 }, 600);
$('#tRotR').onclick = () => flyTo({ theta: curTheta() + Math.PI/4 }, 600);
$('#tIn').onclick = () => flyTo({ zoom: Math.min(controls.maxZoom, camera.zoom*1.35) }, 350);
$('#tOut').onclick = () => flyTo({ zoom: Math.max(controls.minZoom, camera.zoom/1.35) }, 350);
$('#tHome').onclick = () => flyTo(mode.view());
$('#tLabels').onclick = e => { labelsOn = !labelsOn; e.currentTarget.setAttribute('aria-pressed', labelsOn); stage.classList.toggle('labels-off', !labelsOn); };
function applyTheme(){ outlineMat.uniforms.c.value.set(cssVar('--ink3d')); accentColor.set(cssVar('--accent'));
  for (const m of glassMats){ m.uniforms.tint.value.set(cssVar('--glass')); m.uniforms.ink.value.set(cssVar('--glassink')); m.uniforms.acc.value.set(cssVar('--accent')); }
  grid.material.color.set(cssVar('--grid')); benchMat.color.set(cssVar('--bench')); }
function resize(){ const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); const a = w/h;
  camera.left = -VIEW*a/2; camera.right = VIEW*a/2; camera.top = VIEW/2; camera.bottom = -VIEW/2; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
document.fonts?.ready.then(() => hotspots.forEach(h => h.tw = 0));
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); toast('El navegador reinició el 3D. Recarga si no vuelve solo.', 'warn'); });
applyTheme(); resize(); resetOperate(false); setMode('explorar'); $('#loading').remove();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.1);
  stepTween(dt); stepAnims(dt); controls.update(); mode.update(dt); renderer.render(scene, camera); });
</script>
