<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QUIMERA LABS Extracción Soxhlet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: banco de laboratorio a pantalla completa (escena 3D) + cuaderno de práctica a la derecha; en móvil se apilan. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#15212C; --muted:#566874; --line:#D5DEE3;
  --accent:#C2276F; --accent-soft:#F7DCE8; --ok:#23794E; --warn:#9A5B00;
  --ink3d:#15212C; --grid:#D3DCE1; --glass:#BFE2EC; --bench:#F1F4F6; --glassink:#15212C; --water:#8EC9DE; --oil:#E0A93B; --leaf:#5E9E45; color-scheme:light;
  --f-display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow a.home{color:var(--accent);font-weight:500;text-decoration:none}
.eyebrow a.home:hover{text-decoration:underline}
.eyebrow a.home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow b{color:var(--accent);font-weight:500}
h1{margin:0;font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:clamp(22px,3vw,30px);letter-spacing:.01em;line-height:1.05;text-wrap:balance}
.modes{display:flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.modes button{font:600 13px/1 var(--f-display);font-stretch:85%;letter-spacing:.08em;text-transform:uppercase;border:0;background:transparent;color:var(--ink);
  padding:9px 14px;border-radius:999px;cursor:pointer;display:flex;gap:7px;align-items:center}
.modes button .n{font-family:var(--f-mono);font-weight:400;opacity:.6}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.modes button:focus-visible,.tool:focus-visible,.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.stage{position:relative;overflow:hidden;min-height:0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.leader{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 4}
.tie{fill:none;stroke:var(--ink);stroke-width:1.5}
.dot{position:absolute;left:0;top:0;pointer-events:auto;width:18px;height:18px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--surface);
  box-shadow:0 0 0 2px var(--ink),inset 0 0 0 4px var(--surface),inset 0 0 0 9px var(--accent)}
.dot.sel{box-shadow:0 0 0 2px var(--accent),inset 0 0 0 4px var(--surface),inset 0 0 0 9px var(--accent)}
.tag{position:absolute;left:0;top:0;pointer-events:auto;font:700 11.5px/1 var(--f-display);font-stretch:85%;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:6px 8px;cursor:pointer}
.tag.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.locked .toolbar{display:none}
.meters{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.meter{height:12px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;display:flex;background:var(--surface)}
.meter i{display:block;height:100%;transition:width .3s}
.meter i.w{background:var(--water)} .meter i.o{background:var(--oil)} .meter i.g{background:var(--leaf)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rin-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rin-row .seg{flex:1;min-width:180px}
.res{width:100%;border-collapse:collapse;font-size:13.5px}
.res td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.res td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tag-ok{color:var(--ok);font-weight:600}.tag-warn{color:var(--warn);font-weight:600}
.calc{font-family:var(--f-mono);font-size:12.5px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;line-height:1.75;margin-top:8px}
.calc .note{font-family:var(--f-body)}
details.ph summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
.btn:disabled:hover{background:transparent;color:var(--ink)}
.labels-off .tag,.labels-off .tie{display:none}
.hdr-right{display:flex;gap:10px;align-items:center}
.theme{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.popup{position:absolute;top:16px;left:16px;width:min(300px,calc(100% - 32px));background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;
  padding:14px 16px;box-shadow:6px 6px 0 var(--line);display:flex;flex-direction:column;gap:8px}
.popup h3{margin:0;font:800 17px/1.15 var(--f-display);font-stretch:80%;letter-spacing:.04em;text-transform:uppercase;padding-right:28px}
.popup p{margin:0;color:var(--muted);font-size:14px}
.popup .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;background:transparent;color:var(--ink);cursor:pointer;font-size:18px;border-radius:6px}
.btn{align-self:flex-start;font:700 12px/1 var(--f-display);font-stretch:85%;letter-spacing:.09em;text-transform:uppercase;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);border-radius:7px;padding:9px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--ink);color:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;
  background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:4px}
.tool{width:38px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.tool:hover{background:var(--accent-soft)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;background:var(--line);margin:6px 3px}
.toast{position:absolute;left:16px;right:16px;bottom:calc(66px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:min(520px,calc(100% - 32px));
  background:var(--ink);color:var(--surface);border-radius:8px;padding:9px 14px;font-size:14px;text-align:center;transition:opacity .25s}
.toast.warn{background:var(--warn);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.hint{position:absolute;right:16px;top:14px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;line-height:1.6}

aside{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;min-height:0;min-width:0;
  padding-block:20px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
aside h2{margin:0;font:800 24px/1.1 var(--f-display);font-stretch:78%;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
aside h4{margin:0 0 4px;font:700 11.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
aside p{margin:0}
.lead{color:var(--muted)}
.spec{font-family:var(--f-mono);font-size:12.5px;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;color:var(--ink)}
.block{display:flex;flex-direction:column;gap:4px}
.block.err{border-left:3px solid var(--warn);padding-left:12px}
.block.err h4{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px/1 var(--f-body);border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 11px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.steps .st{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:500 11px/1 var(--f-mono);color:var(--muted)}
.steps li.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.next .st{border-color:var(--accent);color:var(--accent)}
.steps li.next b{color:var(--accent)}
.steps li.locked{opacity:.55}
.steps small{display:block;color:var(--muted);font-size:13px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
.ctl{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:600 13px/1 var(--f-body);padding:10px 6px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.reading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border:1.5px solid var(--ink);border-radius:9px;padding:12px 14px}
.reading .v{font:500 30px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.reading .u{font:500 13px var(--f-mono);color:var(--muted)}
.swatch{display:flex;gap:10px;align-items:center}
.swatch i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.state{border-radius:8px;padding:10px 12px;background:var(--accent-soft);font-size:14px}
.state.warn{background:transparent;border:1.5px solid var(--warn)}
.state.ok{background:transparent;border:1.5px solid var(--ok)}
.note{font-size:13px;color:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}

@media (max-width:860px){
  .app{height:auto}
  main{grid-template-columns:1fr}
  .stage{height:62vh;min-height:430px}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  .modes button{padding:9px 11px}
}
@media (prefers-reduced-motion: reduce){ .progress i,.toast{transition:none} }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   1) MANIFIESTO DEL EQUIPO — extracción Soxhlet.
   Mismo motor que los equipos 01 y 02: cambian el manifiesto, las piezas
   (sección 4) y el modo Operar (sección 8).
   ===================================================================== */
const EQUIPO = {
  id: 'soxhlet',
  partes: {
    soporte: { nombre:'Soporte universal y pinzas', tag:'Soporte y pinzas', corto:'Varilla con dos pinzas: una sujeta el cuello del balón y otra el refrigerante.',
      funcion:'Mantiene vertical una columna de vidrio de más de medio metro. Las juntas esmeriladas no deben cargar el peso del refrigerante.',
      uso:'Sujeta el balón por el cuello y el refrigerante por su camisa, alineados en vertical. Aprieta lo justo para que no se deslicen.',
      error:'Sujetar solo el balón: todo el peso del extractor y del refrigerante cae sobre las juntas y pueden romperse.',
      dato:'Varilla de 70 cm · pinzas de tres dedos con funda de goma', requiere:[] },
    manta: { nombre:'Manta calefactora', corto:'Calienta el balón de forma pareja y sin llama.',
      funcion:'Envuelve el fondo del balón con una resistencia eléctrica aislada. Con disolventes inflamables como el hexano, la llama abierta está prohibida.',
      uso:'El balón debe asentarse en la cavidad sin forzar. Sube la potencia poco a poco hasta un hervor suave y constante.',
      error:'Usar un mechero con hexano: sus vapores son más densos que el aire, se extienden por la mesa y pueden encenderse.',
      dato:'Para balones de 250 mL · regulador de potencia', requiere:['soporte'] },
    balon: { nombre:'Balón con hexano', tag:'Balón con disolvente', corto:'Contiene el disolvente que hierve; aquí se acumula la grasa extraída.',
      funcion:'El hexano hierve, sube como vapor y vuelve como líquido en cada ciclo. La grasa no se evapora a esa temperatura, así que se va acumulando en el balón.',
      uso:'Pésalo vacío antes de empezar: esa es la tara. Carga entre 1,5 y 2 veces el volumen del sifón y añade piedras de ebullición.',
      error:'Poner poco disolvente: cuando la cámara se llena, el balón queda casi seco y el extracto se sobrecalienta.',
      dato:'Balón de fondo redondo 250 mL · hexano, hierve a 69 °C a nivel del mar', requiere:['manta'] },
    piedras: { nombre:'Piedras de ebullición', corto:'Trocitos porosos que hacen que el líquido hierva parejo.', sub:'balon',
      funcion:'Sus poros dan puntos donde se forman las burbujas. Sin ellas, el líquido se sobrecalienta y hierve de golpe, con sacudidas (bumping).',
      uso:'Agrégalas con el disolvente frío, antes de calentar. Usa piedras nuevas en cada extracción.',
      error:'Echarlas a un líquido caliente: todo el líquido sobrecalentado puede hervir de golpe y salpicar.',
      dato:'Porcelana porosa · de un solo uso' },
    extractor: { nombre:'Extractor Soxhlet', corto:'Cámara donde el disolvente condensado empapa la muestra y luego vuelve al balón por el sifón.',
      funcion:'Separa el camino de subida (vapor, por el brazo lateral) del de bajada (líquido, por el sifón). Así la muestra recibe siempre disolvente limpio recién condensado.',
      uso:'Encaja la junta esmerilada del extractor en el balón sin forzar. Revisa que las juntas estén limpias.',
      error:'Juntas sucias o mal encajadas: escapan vapores de hexano, que son inflamables.',
      dato:'Cámara de ~100 mL hasta la curva del sifón · juntas esmeriladas', requiere:['balon'] },
    brazo: { nombre:'Brazo lateral de vapor', corto:'Tubo ancho por donde el vapor sube del balón al refrigerante.', sub:'extractor',
      funcion:'Lleva el vapor de hexano desde el balón hasta arriba de la cámara sin pasar por la muestra.',
      uso:'Debe quedar libre de la pinza. Es el tubo ancho y recto, del lado opuesto al sifón.',
      error:'Confundirlo con el sifón al describir el equipo: el brazo sube vapor, el sifón baja líquido.',
      dato:'Tubo recto y ancho' },
    sifon: { nombre:'Sifón', corto:'Tubo curvo que vacía la cámara de golpe cuando el líquido llega a su curva.', sub:'extractor',
      funcion:'Funciona como vasos comunicantes: el líquido sube por el sifón al mismo nivel que en la cámara. Cuando supera la curva, el sifón se ceba y vacía toda la cámara en el balón. Cada descarga es un ciclo.',
      uso:'La muestra debe quedar por debajo de la curva del sifón, para que quede sumergida en cada ciclo.',
      error:'Cartucho más alto que el sifón: la parte de arriba de la muestra nunca se sumerge y la extracción queda incompleta.',
      dato:'Tubo delgado en forma de U invertida' },
    cartucho: { nombre:'Cartucho con la muestra', tag:'Cartucho y muestra', corto:'Dedal de celulosa con la muestra molida y un tapón de algodón.',
      funcion:'Retiene la muestra sólida y deja pasar el disolvente. El algodón de arriba reparte las gotas y evita que floten partículas.',
      uso:'Muestra seca, molida y pesada (5,0000 g). Tapa con algodón y verifica que el cartucho quede por debajo de la curva del sifón.',
      error:'Olvidar el algodón: partículas finas de la muestra pasan por el sifón al balón y el resultado sale más alto que el real.',
      dato:'Celulosa · muestra de 5,0000 g en balanza analítica', requiere:['extractor'] },
    condensador: { nombre:'Refrigerante de bolas', tag:'Refrigerante de bolas', corto:'Condensa el vapor de hexano y lo devuelve gota a gota sobre la muestra.',
      funcion:'El vapor sube por el tubo interior y el agua fría de la camisa lo condensa. Las bolas aumentan la superficie fría y evitan que el vapor escape.',
      uso:'El agua entra por la boquilla de abajo y sale por la de arriba. El extremo superior queda abierto a la atmósfera.',
      error:'Taparlo arriba: el sistema queda cerrado, la presión sube al calentar y el vidrio puede reventar.',
      dato:'Tipo Allihn · 5 bolas', requiere:['cartucho'] },
    mangueras: { nombre:'Bomba y mangueras', corto:'Circuito de agua fría del refrigerante.',
      funcion:'Hace circular agua fría por la camisa del refrigerante durante toda la extracción, que puede durar horas.',
      uso:'Asegura las mangueras con abrazaderas y enciende el agua antes que la manta.',
      error:'Encender la manta sin agua: el vapor de hexano sale por arriba del refrigerante.',

const glassMats = [];
function glassMat(){
  const m = new THREE.ShaderMaterial({ uniforms:{ tint:{value:new THREE.Color()}, ink:{value:new THREE.Color()}, acc:{value:new THREE.Color()}, hi:{value:0} },
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:`varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 tint; uniform vec3 ink; uniform vec3 acc; uniform float hi; varying vec3 vN;
      void main(){ vec3 n = normalize(vN); float f = 1.0 - abs(n.z); float rim = smoothstep(0.66, 0.97, f);
        float band = gl_FrontFacing ? smoothstep(0.22,0.28,n.x) * (1.0 - smoothstep(0.40,0.46,n.x)) : 0.0;

}

const pickables = [];
function mk(geo, mat, parent, { pos=[0,0,0], rot=[0,0,0], outline=true, shadow=true, part=null, sub=null, ctrl=null, order=0, noGhost=false }={}){
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = shadow; m.receiveShadow = true; m.renderOrder = order; if (noGhost) m.userData.noGhost = true;
  if (outline){ const o = new THREE.Mesh(geo, outlineMat); o.userData.outline = true; o.castShadow = false; o.raycast = ()=>{}; m.add(o); }
  if (part){ m.userData.part = part; if (sub) m.userData.sub = sub; if (ctrl) m.userData.ctrl = ctrl; pickables.push(m); }
  parent.add(m); return m;
}
const colliderMat = new THREE.MeshBasicMaterial({ visible:false });
function collider(geo, parent, pos, part, { sub=null, ctrl=null, quat=null }={}){ const m = new THREE.Mesh(geo, colliderMat); m.position.set(...pos); if (quat) m.quaternion.copy(quat);
  m.userData.part = part; if (sub) m.userData.sub = sub; if (ctrl) m.userData.ctrl = ctrl; pickables.push(m); parent.add(m); return m; }
function anchor(key, name, pos){ const a = new THREE.Object3D(); a.position.set(...pos); a.userData = { name }; parts[key].group.add(a); parts[key].anchors.push(a); return a; }
const box = (w,h,d,r=0.35) => new RoundedBoxGeometry(w,h,d,3,r);
// Cilindro entre dos puntos (varillas, patas, tubos rectos)
function segment(a, b, r, mat, parent, opts={}){ const A = new V3(...a), B = new V3(...b), d = B.clone().sub(A);
  const m = mk(new THREE.CylinderGeometry(r, r, d.length(), opts.seg || 14), mat, parent, { ...opts, pos:A.clone().add(B).multiplyScalar(0.5).toArray() });
  m.quaternion.setFromUnitVectors(Y, d.normalize()); return m; }
// Tubo curvo por puntos (vidrio doblado, mangueras). Guarda la curva para mover partículas por dentro.
function tube(pts, r, mat, parent, opts={}){ const curve = new THREE.CatmullRomCurve3(pts.map(p => new V3(...p)), false, 'centripetal');
  const m = mk(new THREE.TubeGeometry(curve, opts.tseg || 90, r, 10, false), mat, parent, opts); m.userData.curve = curve; return m; }
// Superficie de revolución a partir de una función radio(y)
function lathe(fnR, y0, y1, n=18){ const pts = [new V2(0,y0)]; for (let i=0;i<=n;i++){ const y = y0+(y1-y0)*i/n; pts.push(new V2(Math.max(0.03, fnR(y)), y)); } pts.push(new V2(0,y1)); return new THREE.LatheGeometry(pts, 36); }
// Líquido entre dos alturas dentro de un recipiente (se reconstruye solo si cambia)
function liquid(parent, pos, fnR, mat, order=1){
  const L = { a:-1, b:-1 }; L.mesh = mk(new THREE.BufferGeometry(), mat, parent, { pos, outline:false, shadow:false, order, noGhost:true }); L.mesh.visible = false;
  L.set = (na, nb) => { if (Math.abs(na-L.a) < 0.015 && Math.abs(nb-L.b) < 0.015) return; L.a = na; L.b = nb;
    L.mesh.visible = nb - na > 0.03; if (L.mesh.visible){ L.mesh.geometry.dispose(); L.mesh.geometry = lathe(fnR, na, nb); } };
  return L; }
const sphR = (R, inset) => y => Math.sqrt(Math.max(0, R*R - (y-R)*(y-R))) - inset;
function roundFlask(R, neckR, neckTop){ const pts = [], yJ = R + Math.sqrt(R*R - neckR*neckR), aTop = Math.asin((yJ-R)/R);
  for (let i=0;i<=24;i++){ const a = -Math.PI/2 + (aTop + Math.PI/2)*i/24; pts.push(new V2(Math.max(0.001, R*Math.cos(a)), R + R*Math.sin(a))); }
  pts.push(new V2(neckR, neckTop), new V2(neckR+0.25, neckTop+0.1), new V2(neckR+0.25, neckTop+0.5), new V2(neckR, neckTop+0.55)); return new THREE.LatheGeometry(pts, 44); }

/* ====================== 8) Operación ======================

   · Volúmenes reales: cámara de ~100 mL hasta la curva del sifón; el sifón descarga cuando el nivel la alcanza.
   · Extracción: mientras el disolvente cubre la muestra, la grasa pasa a la cámara (cinética de primer orden);
     cada descarga del sifón la lleva al balón, donde se acumula porque no se evapora.
   · Al final: gravimetría (balón con grasa − tara) / masa de muestra.

  op.dry = on && op.Vb < 6;                                                            // sin hexano en el balón: se sobrecalienta
  op.T = on ? Math.min(op.dry ? 2 : 1, op.T + dts*(op.manta === 2 ? 0.02 : 0.012)) : Math.max(0, op.T - dts*0.008);
  const boiling = on && op.T >= 1 && !op.dry, rate = boiling ? MANTA[op.manta] : 0, dV = Math.min(op.Vb, rate*dts);
  op.Vb -= dV;
  op.jf = op.pump ? Math.min(1, op.jf + dt*0.5) : Math.max(0, op.jf - dt*0.25);
  const cooled = op.jf > 0.8;
  if (dV){ if (cooled) op.Vch += dV; else op.lost += dV; }                            // sin agua, el vapor escapa por arriba
  // --- extracción: la grasa pasa de la muestra al líquido de la cámara
  const dripping = dV > 0 && cooled, k = CARGA[op.carga];
  const cover = clamp01((level() - 18.9)/(Math.min(k.s, APEX) - 18.9));
  const dLow = op.fatLow*(KC*cover + (dripping ? KP*8 : 0))*dts, dHigh = op.fatHigh*(dripping ? KP : 0)*dts;
  if (op.Vch > 0.5){ op.fatLow -= dLow; op.fatHigh -= dHigh; op.fatCh += dLow + dHigh; }
  // --- sifón: se ceba al llegar a la curva y vacía la cámara de golpe
  if (!op.sif && op.Vch >= VSIF){ op.sif = true; op.ciclos++; if (op.carga === 'sinAlgodon') op.solids += 0.012 + Math.random()*0.006; }
  if (op.sif){ const d = Math.min(op.Vch, Math.max(14*dt, 4*MANTA[2]*dts)), fr = op.Vch > 0 ? d/op.Vch : 1;
    const df = op.fatCh*fr; op.fatCh -= df; op.fatB += df; op.Vch -= d; op.Vb += d;
    if (op.Vch < 0.3){ op.Vb += op.Vch; op.fatB += op.fatCh; op.Vch = 0; op.fatCh = 0; op.sif = false; } }
  // --- ebullición sin piedras: sacudidas
  op.bump = Math.max(0, op.bump - dt*3);
  if (boiling && !op.piedras){ op.bumpT -= dt; if (op.bumpT <= 0){ op.bump = 1; op.bumpT = 2 + Math.random()*3;
    for (let i = 0; i < 6; i++) spawn(P.big, { x:(Math.random()-0.5)*4, y:4.8, z:(Math.random()-0.5)*4, v:9 + Math.random()*5 }); } }
  // --- piezas animadas
  mantle.knob.rotation.y += ((-op.manta*1.3) - mantle.knob.rotation.y)*Math.min(1, dt*8);
  mantle.led.color.set(on ? 0xF0782D : 0x55606a);
  mantle.glow.color.set(0x3A2A22).lerp(new THREE.Color(0xE0662A), on ? 0.35 + 0.3*op.manta : 0);
  pump.led.color.set(op.pump ? 0x3ED37A : 0x55606a);
  cond.water.scale.y = Math.max(0.001, 14.6*op.jf);
  flask.liq.mesh.position.x = op.bump*Math.sin(T*60)*0.12;
  syncLiquids();
  // --- partículas
  const surf = 4.2 + 0.15 + capH(op.Vb, 4.85);
  every('bub', boiling ? (op.piedras ? 10 + op.manta*6 : 1) : 0, dt, () => { const a = Math.random()*6.28, r = Math.random()*2.6;
    spawn(P.bub, { x:Math.cos(a)*r, z:Math.sin(a)*r, y:4.9, top:surf - 0.15 }); });
  for (const p of P.bub) if (p.on){ p.y += dt*(4 + Math.random()*2); if (p.y >= p.top) kill(p); else p.m.position.set(p.x, p.y, p.z); }
  for (const p of P.big) if (p.on){ p.y += dt*p.v; if (p.y >= surf + 1.2) kill(p); else p.m.position.set(p.x, p.y, p.z); }
  every('vap', boiling ? 6 + op.manta*6 : 0, dt, () => spawn(P.vap, { u:0 }));
  const uCond = 0.66;                                                                   // con agua fría el vapor se condensa en las primeras bolas
  for (const p of P.vap) if (p.on){ p.u += dt*0.42; const lim = cooled ? uCond : 1;
    if (p.u >= lim){ kill(p); if (!cooled) spawn(P.escape, { x:0, y:55.5, z:0, life:0 }); continue; }
    p.m.position.copy(vapPath.getPointAt(p.u)); p.m.scale.setScalar(cooled && p.u > 0.5 ? Math.max(0.2, 1 - (p.u - 0.5)/0.16) : 1); }
  for (const p of P.escape) if (p.on){ p.life += dt; p.y += dt*3; p.x += dt*1.5; p.m.position.set(p.x, p.y, p.z); p.m.scale.setScalar(1 + p.life*1.5); if (p.life > 1.8) kill(p); }
  const dripTop = Math.max(level(), CARGA[op.carga].s + (CARGA[op.carga].algodon ? 0.7 : 0));
  every('drip', dripping ? 3 + op.manta*3 : 0, dt, () => spawn(P.drip, { y:32.4, v:0 }));
  for (const p of P.drip) if (p.on){ p.v -= 60*dt; p.y += p.v*dt; if (p.y <= dripTop) kill(p); else p.m.position.set(0, p.y, 0); }
  every('sif', op.sif ? 28 : 0, dt, () => spawn(P.sif, { u:0 }));
  for (const p of P.sif) if (p.on){ p.u += dt*0.9; if (p.u >= 1){ kill(p); continue; } p.m.position.copy(ext.sifCurve.getPointAt(p.u)); }
  every('hose', op.pump ? 22 : 0, dt, () => spawn(P.hose, { u:0, c:Math.random() < 0.5 ? 0 : 1 }));
  for (const p of P.hose) if (p.on){ p.u += dt*0.5; if (p.u >= 1 || !op.pump) kill(p); else p.m.position.copy(pump.curves[p.c].getPointAt(p.u)); }
  // --- panel
  const st = opStatus(), key = st.join('|') + canFinish() + op.pump + op.manta + op.piedras + op.vel + op.everOn + op.done;
  if (key !== op.lastKey) renderOperatePanel();
  const rest = (op.fatLow + op.fatHigh)/op.fatTot;
  setTxt('vCic', String(op.ciclos)); setTxt('vT', `${fmt(tSolv())} °C`); setTxt('vB', `${fmt(op.Vb,0)} mL`);
  setTxt('vCh', `${fmt(op.Vch,0)} de ${VSIF} mL`); setMeter('mCh', op.Vch/VSIF); setMeter('mRest', rest);
  setTxt('vRest', `${fmt(rest*100,0)} %`);
  const h = Math.floor(op.t/3600), mi = Math.floor(op.t/60)%60; setTxt('vTime', `${h} h ${String(mi).padStart(2,'0')} min`);
}
function setMeter(id, v){ const el = document.getElementById(id); if (el) el.style.width = (clamp01(v)*100).toFixed(1) + '%'; }
function setTxt(id, s){ const el = document.getElementById(id); if (el && el.textContent !== s) el.textContent = s; }

function opStatus(){
  const on = op.manta > 0, boiling = on && op.T >= 1 && !op.dry, cooled = op.jf > 0.8, lowRest = op.fatLow/op.fatTot;
  if (op.done) return ['', 'Extracción terminada. Revisa el resultado de la pesada.'];
  if (op.dry) return ['warn','¡El balón está casi seco! Toda la carga de hexano está en la cámara y el extracto se sobrecalienta. Apaga la manta. Faltó disolvente: debe ser 1,5 a 2 veces el volumen del sifón.'];
  if (boiling && !cooled) return ['warn','Los vapores de hexano salen por arriba del refrigerante: son inflamables y la cámara no se llena. Enciende el agua.'];
  if (on && !op.pump) return ['warn','Primero el agua del refrigerante y después el calor.'];
  if (boiling && !op.piedras) return ['warn','Ebullición con sacudidas (bumping): faltan piedras de ebullición. Apaga, deja enfriar y agrégalas en frío.'];
  if (op.sif) return ['ok',`¡El sifón se cebó! La cámara se vacía de golpe en el balón. Ciclo ${op.ciclos}.`];
  if (boiling && lowRest < 0.03 && op.ciclos >= 2) return ['ok','El líquido de la cámara ya sale casi incoloro: la muestra está agotada. Apaga la manta justo después de una descarga del sifón.'];
  if (boiling && op.Vch > 0 && level() >= 18.9) return ['',`El hexano condensado gotea sobre la muestra y llena la cámara. El sifón sube al mismo nivel; cuando llegue a la curva, descargará.`];
  if (boiling) return ['','El vapor sube por el brazo lateral, se condensa en las bolas del refrigerante y empieza a gotear.'];
  if (on) return ['',`Calentando el hexano. Hierve a ${fmt(op.Tb)} °C en ${LUGARES[op.lugar].nombre}.`];
  if (op.everOn && op.Vch > 3) return ['warn',`Apagaste con ${fmt(op.Vch,0)} mL en la cámara: esa grasa no llegó al balón. Lo correcto es apagar justo después de una descarga.`];
  if (op.everOn && op.T >= 0.4) return ['','Enfriando antes de desmontar…'];
  if (canFinish()) return ['ok','Frío. Ya puedes retirar el balón, evaporar el hexano y pesar la grasa.'];
  return ['','Revisa el montaje y la carga. Luego enciende la bomba del refrigerante y la manta.'];
}

function resultsHTML(){
  const r = op.res, mu = MUESTRAS[op.muestra], err = r.pct - r.ref, notes = [];
  if (op.carga === 'alto') notes.push(`La parte de la muestra sobre la curva del sifón nunca se sumergió: quedaron ${fmt(r.queda,3)} g de grasa sin extraer.`);
  else if (r.queda/op.fatTot > 0.04) notes.push(`Faltaron ciclos: quedaron ${fmt(r.queda,3)} g de grasa en la muestra.`);
  if (r.camara > 0.02) notes.push(`${fmt(r.camara,3)} g de grasa quedaron en la cámara porque apagaste antes de la descarga.`);
  if (op.carga === 'sinAlgodon') notes.push(`Sin algodón pasaron ${fmt(op.solids,3)} g de partículas de muestra al balón y se pesaron como si fueran grasa.`);
  if (op.lost > 1) notes.push(`Se perdieron ${fmt(op.lost,0)} mL de hexano por arriba del refrigerante.`);
  return `<div class="block"><h4>Gravimetría</h4><div class="calc">
    Balón vacío (tara) ......... ${fmt(r.tara,4)} g<br>Balón + grasa, sin hexano .... ${fmt(r.bruto,4)} g<br>
    Grasa = ${fmt(r.bruto,4)} − ${fmt(r.tara,4)} = <b>${fmt(r.grasa,4)} g</b><br>
    % grasa = ${fmt(r.grasa,4)} / ${fmt(M_MUESTRA,4)} × 100 = <b>${fmt(r.pct,2)} %</b></div></div>
    <table class="res"><tbody>
      <tr><td>Grasa real de esta muestra de ${mu.nombre.toLowerCase()}</td><td class="n">${fmt(r.ref,2)} %</td></tr>
      <tr><td>Diferencia</td><td class="n ${Math.abs(err) <= 0.5 ? 'tag-ok' : 'tag-warn'}">${err >= 0 ? '+' : '−'}${fmt(Math.abs(err),2)} puntos</td></tr>
      <tr><td>Ciclos del sifón</td><td class="n">${op.ciclos}</td></tr>
    </tbody></table>
    ${notes.length ? notes.map(n => `<p class="tag-warn">${n}</p>`).join('') : '<p class="tag-ok">Extracción completa y bien terminada.</p>'}`;
}

function renderOperatePanel(){
  const [kind, msg] = opStatus(), lock = op.everOn, mu = MUESTRAS[op.muestra];
  const seg = (name, opts, cur, attr, disabled=false) => `<div class="seg" role="group" aria-label="${name}">${opts.map((t,i) => `<button ${attr}="${i}" aria-pressed="${cur===i}" ${disabled?'disabled':''}>${t}</button>`).join('')}</div>`;
  const mk_ = Object.keys(MUESTRAS), cg = Object.keys(CARGA), lk = Object.keys(LUGARES);
  panel.innerHTML = `<div class="block"><h4>Modo operar</h4><h2>Extrae y pesa la grasa</h2></div>
    <div class="ctl"><h4>Muestra (5,0000 g, molida y seca)</h4>${seg('Muestra', mk_.map(k => MUESTRAS[k].nombre), mk_.indexOf(op.muestra), 'data-mu', lock)}</div>
    <div class="ctl"><h4>Carga del cartucho</h4>${seg('Carga', ['Bien cargado','Sobre el sifón','Sin algodón'], cg.indexOf(op.carga), 'data-cg', lock)}</div>
    <div class="ctl"><h4>Hexano en el balón</h4>${seg('Volumen', ['175 mL','100 mL'], op.vol === 175 ? 0 : 1, 'data-vo', lock)}</div>
    <div class="ctl"><h4>Lugar</h4>${seg('Lugar', lk.map(k => LUGARES[k].nombre), lk.indexOf(op.lugar), 'data-lu', lock)}
      ${lock ? '<span class="note">Para cambiar la muestra o el montaje, reinicia.</span>' : ''}</div>
    <div class="ctl"><h4>Piedras de ebullición</h4>${seg('Piedras', ['Con piedras','Sin piedras'], op.piedras ? 0 : 1, 'data-pi', op.done)}</div>
    <div class="ctl"><h4>Agua del refrigerante (bomba)</h4>${seg('Bomba', ['Apagada','Encendida'], op.pump ? 1 : 0, 'data-pu', op.done)}</div>
    <div class="ctl"><h4>Manta calefactora</h4>${seg('Manta', ['Apagada','Media','Alta'], op.manta, 'data-ma', op.done)}</div>
    <div class="reading"><div><h4>Ciclos del sifón</h4><span class="note">Tiempo de extracción: <span id="vTime">0 h 00 min</span></span></div><div><span class="v" id="vCic">${op.ciclos}</span></div></div>
    <div class="meters">
      <div class="mrow"><span>Hexano del balón · <b id="vB"></b> · <span id="vT"></span></span></div>
      <div class="mrow"><span>Cámara · <span id="vCh"></span></span><div class="meter"><i class="w" id="mCh"></i></div></div>
      <div class="mrow"><span>Grasa que queda en la muestra · <span id="vRest"></span></span><div class="meter"><i class="o" id="mRest"></i></div></div>
    </div>
    <div class="state ${kind}">${msg}</div>
    <div class="rin-row"><button class="btn" id="lookSif">Ver el sifón de cerca</button>
      ${seg('Velocidad', ['× 1','× 10','× 60'], [1,10,60].indexOf(op.vel), 'data-ve')}</div>
    ${op.done ? resultsHTML() : `<div class="ctl"><button class="btn primary" id="fin" ${canFinish() ? '' : 'disabled'}>Evaporar el hexano y pesar</button>
      <span class="note">Se habilita con la manta apagada, el balón frío y al menos un ciclo completo.</span></div>`}
    <details class="ph"><summary>¿Cómo funciona el sifón?</summary><div class="calc" style="font-family:var(--f-body);font-size:13.5px">
      El sifón y la cámara son vasos comunicantes: el líquido sube por el sifón al mismo nivel que en la cámara.
      Cuando el nivel supera la curva (unos ${VSIF} mL), el líquido empieza a bajar por la otra rama y arrastra todo el resto: la cámara se vacía de golpe.
      El hexano vuelve al balón con la grasa disuelta; el hexano vuelve a hervir, pero la grasa se queda abajo.<br><br>
      El hexano hierve a ${fmt(op.Tb)} °C con ${LUGARES[op.lugar].P} mmHg (ecuación de Antoine).</div></details>
    <button class="btn" id="opReset">Reiniciar</button>
    <p class="note">Grasa de referencia aproximada: maní ~49 %, sacha inchi ~45 %, quinua ~6 %; varía con la variedad. El caudal de vapor y la velocidad de extracción están simplificados.</p>`;
  const on = (sel, fn) => panel.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
  on('[data-mu]', b => { op.muestra = mk_[+b.dataset.mu]; resetOperate(); });
  on('[data-cg]', b => { op.carga = cg[+b.dataset.cg]; resetOperate(); });
  on('[data-vo]', b => { op.vol = b.dataset.vo === '0' ? 175 : 100; resetOperate(); });
  on('[data-lu]', b => { op.lugar = lk[+b.dataset.lu]; resetOperate(); });
  on('[data-pi]', b => setPiedras(b.dataset.pi === '0'));
  on('[data-pu]', b => setPump(b.dataset.pu === '1'));
  on('[data-ma]', b => setManta(+b.dataset.ma));
  on('[data-ve]', b => { op.vel = [1,10,60][+b.dataset.ve]; renderOperatePanel(); });
  $('#lookSif').onclick = lookAtSiphon;
  const f = $('#fin'); if (f) f.onclick = () => canFinish() && finish();
  $('#opReset').onclick = () => resetOperate();
  op.lastKey = [kind,msg].join('|') + canFinish() + op.pump + op.manta + op.piedras + op.vel + op.everOn + op.done;
}

/* ====================== 9) Cambio de modo, eventos y bucle ====================== */
function setMode(name){ if (mode === MODES[name]) return; mode?.exit(); mode = MODES[name];
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === name)); mode.enter(); }
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
let downAt = null;
renderer.domElement.addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY];
  if (mode === MODES.ensamblar && ev.button === 0 && startDrag(ev)){ renderer.domElement.setPointerCapture(ev.pointerId); ev.stopImmediatePropagation(); } }, { capture:true });
renderer.domElement.addEventListener('pointermove', ev => {
  if (drag){ moveDrag(ev); return; }
  if (mode === MODES.ensamblar){ if (!ev.buttons) renderer.domElement.style.cursor = pick(ev, looseList()) ? 'grab' : ''; return; }
  if (ev.buttons) return;
  const hit = pick(ev);
  if (mode === MODES.operar){ renderer.domElement.style.cursor = hit?.object.userData.ctrl ? 'pointer' : ''; return; }
  const key = hit ? keyOf(hit.object) : null;
  if (key !== hovered){ if (hovered && hovered !== selected) setHighlight(hovered,false); hovered = key; if (hovered && hovered !== selected) setHighlight(hovered,true,0.12); }
  renderer.domElement.style.cursor = key ? 'pointer' : ''; });
renderer.domElement.addEventListener('pointerup', ev => { if (drag){ endDrag(); return; }
  if (!downAt || Math.hypot(ev.clientX-downAt[0], ev.clientY-downAt[1]) > 5) return; mode.click?.(pick(ev)); });
const curTheta = () => new THREE.Spherical().setFromVector3(new V3().subVectors(camera.position, controls.target)).theta;
$('#tRotL').onclick = () => flyTo({ theta: curTheta() - Math.PI/4 }, 600);
$('#tRotR').onclick = () => flyTo({ theta: curTheta() + Math.PI/4 }, 600);
$('#tIn').onclick = () => flyTo({ zoom: Math.min(controls.maxZoom, camera.zoom*1.35) }, 350);
$('#tOut').onclick = () => flyTo({ zoom: Math.max(controls.minZoom, camera.zoom/1.35) }, 350);
$('#tHome').onclick = () => flyTo(mode.view());
$('#tLabels').onclick = e => { labelsOn = !labelsOn; e.currentTarget.setAttribute('aria-pressed', labelsOn); stage.classList.toggle('labels-off', !labelsOn); };
function applyTheme(){ outlineMat.uniforms.c.value.set(cssVar('--ink3d')); accentColor.set(cssVar('--accent'));
  for (const m of glassMats){ m.uniforms.tint.value.set(cssVar('--glass')); m.uniforms.ink.value.set(cssVar('--glassink')); m.uniforms.acc.value.set(cssVar('--accent')); }
  grid.material.color.set(cssVar('--grid')); benchMat.color.set(cssVar('--bench')); }
function resize(){ const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); const a = w/h;
  camera.left = -VIEW*a/2; camera.right = VIEW*a/2; camera.top = VIEW/2; camera.bottom = -VIEW/2; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
document.fonts?.ready.then(() => hotspots.forEach(h => h.tw = 0));
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); toast('El navegador reinició el 3D. Recarga si no vuelve solo.', 'warn'); });
applyTheme(); resize(); resetOperate(false); setMode('explorar'); $('#loading').remove();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.1);
  stepTween(dt); stepAnims(dt); controls.update(); mode.update(dt); renderer.render(scene, camera); });
</script>
